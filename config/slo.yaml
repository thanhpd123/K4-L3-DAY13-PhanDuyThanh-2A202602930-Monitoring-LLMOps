service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: >-
    Ngưỡng 3000ms được chọn từ baseline thật của bài làm: P50 khoảng 400ms,
    P95 khoảng 1600ms và TTFT P95 chỉ khoảng 50ms. Ngưỡng này rộng hơn tail
    latency bình thường nhưng vẫn bắt được sự cố retrieval chậm, vì khi bật
    incident practice rag_slow thì một request nhảy lên trên 3 giây.
  error_budget_math: >-
    SLO 99.5% trong 28 ngày nghĩa là error budget 0.5%. Nếu workload có 10,000
    request thì tối đa 50 request được phép lỗi hoặc chậm hơn 3000ms. Khi vượt
    50 request, hệ thống đã tiêu hết error budget của cửa sổ 28 ngày và phải
    dừng mọi thay đổi rủi ro (prompt mới, deploy mới) cho tới khi hồi phục.
  burn_rate_note: >-
    Alert latency dùng cửa sổ 5 phút để phản ánh burn rate nhanh; hai alert còn
    lại dùng cửa sổ 10–15 phút để tránh báo động vì vài request lẻ.

guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
